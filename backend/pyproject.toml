[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mol-card-gen"
version = "0.0.1"
description = "Molecular conformer generation + card UI prototype"
authors = [{name = "Development Team"}]
requires-python = ">=3.10"
dependencies = [
    "mlconfgen[torch]>=0.4.3",
    "rdkit>=2025.3.4",
    "numpy>=1.24.3,<2; python_version < '3.13'",
    "numpy>=2.3,<3; python_version >= '3.13'",
    "fastapi==0.138.1",
    "uvicorn==0.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx==0.28.1",
]

[tool.setuptools]
packages = ["src"]
